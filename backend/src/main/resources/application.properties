# ── Servidor ──────────────────────────────────────────────────────────────────
server.port=8080

# ── PostgreSQL ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/arrowhead_db
spring.datasource.username=arrowhead_user
spring.datasource.password=arrowhead_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── JWT ───────────────────────────────────────────────────────────────────────
# IMPORTANTE: cambiar este secret por uno seguro en producción (min 32 chars)
jwt.secret=arrowhead-super-secret-key-cambiar-en-produccion-2026
jwt.expiration-ms=86400000

# ── Acceso al evento ──────────────────────────────────────────────────────────
# Código que los estudiantes ingresan junto a su alias para registrarse/entrar.
# Cambiar por evento (ej. en variables de entorno de despliegue).
app.access-code=ARROWHEAD2026

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=http://localhost:5173

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
